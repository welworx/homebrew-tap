name: Update formulas

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update formula versions
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-formulas.sh

      - name: Commit and push
        if: steps.update.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/*.rb
          git commit -m "Update formulas to latest releases"
          git push
