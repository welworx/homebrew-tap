name: Update formulas

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update formula versions
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-formulas.sh

      - name: Commit and push
        if: steps.update.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/*.rb
          git commit -m "Update formulas to latest releases" -m "${{ steps.update.outputs.summary }}"
          git push
